name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # Job 1: Lint and Test
  # ============================================================
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          pytest


  # ============================================================
  # Job 2: Build, Scan, Push and Sign
  # ============================================================
  security:
    name: Build, Scan, Push and Sign Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the image using the Git commit SHA as the tag
      - name: Build Docker image
        run: |
          docker build \
            -t flask-devops-api:${{ github.sha }} .

      # Scan image for HIGH and CRITICAL vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flask-devops-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag the image for Docker Hub
      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag \
            flask-devops-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:${{ github.sha }}

          docker tag \
            flask-devops-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:latest

      # Push the image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:latest

      # Install Cosign
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # Sign the Docker image
      - name: Sign Docker image with Cosign
        if: github.event_name == 'push'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "$COSIGN_PRIVATE_KEY" > cosign.key

          cosign sign \
            --yes \
            --key cosign.key \
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:${{ github.sha }}

          rm -f cosign.key


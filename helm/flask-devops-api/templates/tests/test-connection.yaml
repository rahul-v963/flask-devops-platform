apiVersion: v1
kind: Pod

metadata:
  name: "{{ include "flask-devops-api.fullname" . }}-test-connection"
  
  labels:
    app.kubernetes.io/component: helm-test

  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded

spec:
  containers:
    - name: health-check

      image: busybox:1.36

      command:
        - wget

      args:
        - -qO-
        - --timeout=5
        - "http://{{ include "flask-devops-api.fullname" . }}:{{ .Values.service.port }}/health"

  restartPolicy: Never

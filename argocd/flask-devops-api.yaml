apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-devops-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rahul-v963/flask-devops-platform.git
    targetRevision: main
    path: helm/flask-devops-api

  destination:
    server: https://kubernetes.default.svc
    namespace: flask-prod

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false

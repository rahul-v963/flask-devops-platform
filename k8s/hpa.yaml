apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: flask-devops-api-hpa
  namespace: flask-prod

spec:
  minReplicas: 2
  maxReplicas: 4

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-devops-api

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
